name: Backend quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-24.04
    # The checks stop themselves at 20 minutes and report the log tail.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: 'python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-tuic-stats.txt'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run frontend checks
        run: |
          # Log to a file, not a pipe: a timed-out browser suite can leave an orphaned
          # process holding the pipe open forever. The checks run in their own process
          # group under a 20-minute watchdog, and failures post the log tail as a
          # public annotation (job logs need a token to read).
          log="$RUNNER_TEMP/step.log"
          setsid npm run check:frontend >"$log" 2>&1 &
          pid=$!
          status=0
          for _ in $(seq 1 1200); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            { echo "== still running after 20 minutes; process tree:"; ps -eo pid,pgid,etimes,args --forest; } >>"$log" 2>&1 || true
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 5
            kill -KILL -- "-$pid" 2>/dev/null || true
            status=124
          else
            wait "$pid" || status=$?
          fi
          cat "$log"
          if [ "$status" -ne 0 ]; then
            # Annotations are truncated at about 4 KB: keep the suites reached and the
            # last meaningful lines, without build listings and passing-test noise.
            {
              echo "suites reached: $(grep -E '^== ' "$log" | tr '\n' ' ')"
              grep -vE 'frontend/dist/|DeprecationWarning|from starlette|^[[:space:]]*(ok [0-9]+|# Subtest|duration_ms|type: .test.|\.\.\.|---)' "$log" | tail -n 40
            } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}' > "$RUNNER_TEMP/tail.txt"
            echo "::error title=check:frontend failed (exit $status)::$(cat "$RUNNER_TEMP/tail.txt")"
            exit 1
          fi
  backend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install dedicated stats test dependency
        run: 'python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-tuic-stats.txt'
      - name: Install OCR tools on the disposable runner
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim poppler-utils
      - run: npm ci --ignore-scripts
      - run: npm run build:react
      - name: Check backend and run tests
        # Lock/deployment tests require root. Use only this disposable runner,
        # with no production credentials and no deployment step.
        run: sudo env "PATH=$PATH" "PYTHON=$(command -v python)" bash scripts/check-quality.sh
