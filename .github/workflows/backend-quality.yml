name: Backend quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-tuic-stats.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check:frontend
  backend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install dedicated stats test dependency
        run: python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-tuic-stats.txt
      - name: Install OCR tools on the disposable runner
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim poppler-utils
      - run: npm ci --ignore-scripts
      - run: npm run build:react
      - name: Check backend and run tests
        # Lock/deployment tests require root. Use only this disposable runner,
        # with no production credentials and no deployment step.
        run: sudo env "PATH=$PATH" "PYTHON=$(command -v python)" bash scripts/check-quality.sh
