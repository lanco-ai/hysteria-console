[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".codex-guard", ".worktrees"]

[tool.ruff.lint]
# Initial whole-backend gate: syntax and definite name/control-flow errors.
# Full F/I checks apply to adopted files in scripts/check-quality.sh.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
