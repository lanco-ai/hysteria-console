# Keep subscription/admin tokens out of access logs by recording the normalized
# URI without the query string. User-Agent is retained for operational triage.
log_format hy2_no_args escape=json
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent"';

# Bound per-client concurrency and bursts before they consume a Python worker.
# These zones live in http context because this file is installed under
# conf.d; individual panel proxy locations opt in below.
limit_conn_zone $binary_remote_addr zone=hy2_panel_conn:10m;
limit_req_zone $binary_remote_addr zone=hy2_panel_req:10m rate=10r/s;
