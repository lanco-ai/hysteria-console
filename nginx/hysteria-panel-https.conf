server {
    listen __HY_HTTPS_PORT__ ssl;
    listen [::]:__HY_HTTPS_PORT__ ssl;
    server_name __HY_SERVER_HOST__;
    if ($host != "__HY_SERVER_HOST__") { return 421; }
    # TLS may arrive through the public 443 stream proxy. The listener port
    # then differs from the browser's origin; recover its port from Host.
    set $hy2_https_external_port 443;
    if ($http_host ~ ":([0-9]+)$") {
        set $hy2_https_external_port $1;
    }
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    access_log /var/log/nginx/hysteria-panel.access.log hy2_no_args;
    # nginx error entries include the raw request line (and therefore bearer
    # query parameters). Keep request-scoped diagnostics at critical-only;
    # health probes and the query-safe access log retain normal observability.
    error_log /var/log/nginx/hysteria-panel.error.log crit;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml text/yaml;

    ssl_certificate __HY_TLS_CERT__;
    ssl_certificate_key __HY_TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HY2TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    # Every location inherits these limits and proxy settings.
    limit_conn hy2_panel_conn 20;
    limit_conn_status 429;
    limit_req zone=hy2_panel_req burst=40 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_set_header Host __HY_SERVER_HOST__;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port $hy2_https_external_port;

    # Service split (docs/service-split-design.md): exact pages and prefixes,
    # no regex, so the order of these blocks does not matter.
    # Shop service (lancoai-shop, 8084).
    location = / {
        proxy_pass http://127.0.0.1:8084;
    }
    location = /admin/shop {
        proxy_pass http://127.0.0.1:8084;
    }
    location ^~ /api/v1/shop/ {
        proxy_pass http://127.0.0.1:8084;
    }
    location ^~ /static/shop/ {
        proxy_pass http://127.0.0.1:8084;
    }

    # Workbench + AI service (lancoai-workbench, 8085).
    location = /trending {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /admin/plans {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /admin/chat {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /admin/video {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /admin/services {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /api/plans {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /api/plans/ {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /api/journal {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /api/journal/ {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /api/ai/ {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /api/video/ {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /api/v1/admin/services {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /api/v1/github-trending {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /static/workbench/ {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /api/chat/documents/upload {
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:8085;
        proxy_read_timeout 60s;
    }
    # Chat completions stream: do not buffer the SSE response.
    location ^~ /api/chat/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_send_timeout 660s;
        proxy_read_timeout 660s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Loopback-only service-to-service endpoints are never public.
    location ^~ /internal/ {
        return 404;
    }

    # Network service (hysteria-react, 8083): login and sessions, the network
    # console, the user panel, subscriptions and Hysteria authentication.
    location / {
        proxy_pass http://127.0.0.1:8083;
    }
}
