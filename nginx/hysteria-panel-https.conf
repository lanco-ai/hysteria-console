server {
    listen __HY_HTTPS_PORT__ ssl;
    listen [::]:__HY_HTTPS_PORT__ ssl;
    server_name __HY_SERVER_HOST__;
    client_max_body_size 256k;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml text/yaml;

    ssl_certificate __HY_TLS_CERT__;
    ssl_certificate_key __HY_TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HY2TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
