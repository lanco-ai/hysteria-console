# Staged React HTTP cutover template.  This file is not installed by deploy.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __HY_SERVER_HOST__;
    if ($host != "__HY_SERVER_HOST__") { return 421; }
    # Keep the ACME challenge reachable while protecting every application
    # request, including login and API writes, with TLS.
    if ($request_uri !~ "^/\\.well-known/acme-challenge(?:/|$)") {
        return 308 https://$host$request_uri;
    }
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn hy2_panel_conn 20;
    limit_conn_status 429;
    limit_req zone=hy2_panel_req burst=40 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/hysteria-panel.access.log hy2_no_args;
    error_log /var/log/nginx/hysteria-panel.error.log crit;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml text/yaml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /login {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /auth {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/login {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /logout {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/logout {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/change-password {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/panel {
        proxy_pass http://127.0.0.1:8083;
    }
    # The former top-level chat document was retired; do not fall through to
    # the legacy service or redirect it into the administrator panel.
    location = /chat {
        return 404;
    }
    location = /admin/chat {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/services {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/video {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/logs {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/settings {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/usage {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/daily {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/usage-history {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/health {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/incidents {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/config {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/rules {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/landing-egresses {
        proxy_pass http://127.0.0.1:8083;
    }
    location ~ ^/admin/user/[^/]+\.json$ {
        proxy_pass http://127.0.0.1:8081;
    }
    location ~ ^/admin/user/[^/]+$ {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /api/v1 {
        proxy_pass http://127.0.0.1:8083;
    }
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8083;
    }
    # Chat settings, model discovery, and completions are protected by the
    # FastAPI adapter and must not fall through to the legacy service.
    location ^~ /api/chat/ {
        proxy_pass http://127.0.0.1:8083;
    }
    location ^~ /api/video/ {
        proxy_pass http://127.0.0.1:8083;
    }
    # Do not buffer the chat SSE response: the browser must receive each
    # upstream delta as soon as FastAPI emits it.
    location = /api/chat/completions {
        proxy_pass http://127.0.0.1:8083;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
    location ^~ /static/react/assets/ {
        proxy_pass http://127.0.0.1:8083;
    }
    location ^~ /sub/ {
        proxy_pass http://127.0.0.1:8081;
    }
    location ^~ /panel/ {
        proxy_pass http://127.0.0.1:8081;
    }
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8081;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_set_header Host __HY_SERVER_HOST__;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
}
