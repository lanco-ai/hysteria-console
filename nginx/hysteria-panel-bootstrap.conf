server {
    listen 80;
    listen [::]:80;
    server_name __HY_SERVER_HOST__;
    if ($host != "__HY_SERVER_HOST__") { return 421; }
    client_max_body_size 256k;
    access_log /var/log/nginx/hysteria-panel.access.log hy2_no_args;
    error_log /var/log/nginx/hysteria-panel.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Do not expose credentials over plaintext while the first certificate is
    # being issued. The HTTPS helper replaces this bootstrap with a permanent
    # redirect only after the certificate and TLS vhost validate.
    location / {
        add_header Cache-Control "no-store" always;
        return 503;
    }
}
