# React/FastAPI HTTPS vhost for the three LancoAI services. The deployment
# script installs this template atomically when HY_UNIFIED_FASTAPI=1.
# Pages and APIs are routed by exact path or longest prefix (no regex order):
#   8083 network service (hysteria-react): login and sessions, the network
#        console, the user panel, subscriptions, compatibility URLs, the rest
#   8084 shop service (lancoai-shop): /, /admin/shop, /api/v1/shop/, /static/shop/
#   8085 workbench + AI service (lancoai-workbench): /trending, /admin/plans,
#        /admin/chat, /admin/video, /admin/services and their APIs
# See docs/service-split-design.md.
server {
    listen __HY_HTTPS_PORT__ ssl;
    listen [::]:__HY_HTTPS_PORT__ ssl;
    listen 8444 ssl;
    listen [::]:8444 ssl;
    listen 8445 ssl;
    listen [::]:8445 ssl;
    server_name __HY_SERVER_HOST__;
    if ($host != "__HY_SERVER_HOST__") { return 421; }
    # TLS may arrive through the public 443 stream proxy. The listener port
    # then differs from the browser's origin; recover its port from Host.
    set $hy2_https_external_port 443;
    if ($http_host ~ ":([0-9]+)$") {
        set $hy2_https_external_port $1;
    }
    # Three public sites: shop on 443, network on 8444, workbench on 8445.
    # Keep APIs and login on each origin; redirect only GET/HEAD documents.
    set $hy2_site_document "$server_port:$request_method:$uri";
    if ($hy2_site_document ~ "^8444:(GET|HEAD):/$") {
        return 302 https://__HY_SERVER_HOST__:8444/admin;
    }
    if ($hy2_site_document ~ "^8445:(GET|HEAD):/$") {
        return 302 https://__HY_SERVER_HOST__:8445/admin/plans;
    }
    if ($hy2_site_document ~ "^(8444|8445):(GET|HEAD):/admin/shop$") {
        return 302 https://__HY_SERVER_HOST__$request_uri;
    }
    if ($hy2_site_document ~ "^(?!8445:)[0-9]+:(GET|HEAD):(/trending|/admin/(plans|chat|video|services))$") {
        return 302 https://__HY_SERVER_HOST__:8445$request_uri;
    }
    if ($hy2_site_document ~ "^(?!8444:)[0-9]+:(GET|HEAD):(/admin|/admin/(logs|settings|usage|daily|usage-history|health|incidents|config|rules|landing-egresses)|/admin/user/(?![^/]+[.]json$)[^/]+|/user/panel)$") {
        return 302 https://__HY_SERVER_HOST__:8444$request_uri;
    }

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn hy2_panel_conn 20;
    limit_conn_status 429;
    limit_req zone=hy2_panel_req burst=40 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/hysteria-panel.access.log hy2_no_args;
    error_log /var/log/nginx/hysteria-panel.error.log crit;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml text/yaml;

    ssl_certificate __HY_TLS_CERT__;
    ssl_certificate_key __HY_TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HY2TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    # React documents are exact routes; there is deliberately no SPA fallback.
    location = / {
        proxy_pass http://127.0.0.1:8084;
    }
    location = /login {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /auth {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/login {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /logout {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/logout {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/change-password {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/panel {
        proxy_pass http://127.0.0.1:8083;
    }
    # The former top-level chat document was retired; do not fall through to
    # the legacy service or redirect it into the administrator panel.
    location = /chat {
        return 404;
    }
    location = /admin/chat {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /admin/plans {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /admin/shop {
        proxy_pass http://127.0.0.1:8084;
    }

    location = /admin/github-trending {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/services {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /admin/video {
        proxy_pass http://127.0.0.1:8085;
    }
    # 开源发现 moved from /?view=trending (the shop redirects old links).
    location = /trending {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /admin {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/logs {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/settings {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/usage {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/daily {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/usage-history {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/health {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/incidents {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/config {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/rules {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/landing-egresses {
        proxy_pass http://127.0.0.1:8083;
    }
    location ~ ^/admin/user/[^/]+\.json$ {
        proxy_pass http://127.0.0.1:8083;
    }
    location ~ ^/admin/user/[^/]+$ {
        proxy_pass http://127.0.0.1:8083;
    }

    # React's authenticated API and immutable build assets.
    # Service split: the shop (8084) and workbench + AI (8085) APIs; every other
    # /api/v1/ path, the login and session endpoints included, stays on 8083.
    location ^~ /api/v1/shop/ {
        proxy_pass http://127.0.0.1:8084;
    }
    location ^~ /api/v1/admin/services {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /api/v1/github-trending {
        proxy_pass http://127.0.0.1:8085;
    }
    location = /api/journal {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /api/journal/ {
        proxy_pass http://127.0.0.1:8085;
    }
    # Loopback-only service-to-service endpoints are never public.
    location ^~ /internal/ {
        return 404;
    }
    location = /api/v1 {
        proxy_pass http://127.0.0.1:8083;
    }
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8083;
    }
    # Plans and shared AI service APIs are admin-authenticated by FastAPI.
    location = /api/plans {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /api/plans/ {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /api/ai/ {
        proxy_pass http://127.0.0.1:8085;
    }
    # Chat settings, model discovery, and completions are protected by the
    # FastAPI adapter and must not fall through to the legacy service.
    location = /api/chat/documents/upload {
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:8085;
        proxy_read_timeout 60s;
    }
    location ^~ /api/chat/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
    location ^~ /api/video/ {
        proxy_pass http://127.0.0.1:8085;
    }
    # Do not buffer the chat SSE response: the browser must receive each
    # upstream delta as soon as FastAPI emits it.
    location = /api/chat/completions {
        proxy_pass http://127.0.0.1:8085;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
    location ^~ /static/shop/ {
        proxy_pass http://127.0.0.1:8084;
    }
    location ^~ /static/workbench/ {
        proxy_pass http://127.0.0.1:8085;
    }
    location ^~ /static/react/assets/ {
        proxy_pass http://127.0.0.1:8083;
    }

    # Subscription downloads, panel exchanges and compatibility URLs are
    # served by the same FastAPI process; no legacy listener is involved.
    location ^~ /sub/ {
        proxy_pass http://127.0.0.1:8083;
    }
    location ^~ /panel/ {
        proxy_pass http://127.0.0.1:8083;
    }
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8083;
    }
    location / {
        proxy_pass http://127.0.0.1:8083;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_set_header Host __HY_SERVER_HOST__;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port $hy2_https_external_port;
}
