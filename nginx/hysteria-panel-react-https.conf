# Staged React cutover template.  This file is not installed by deploy.sh.
# React documents/API/assets use the loopback ASGI service on 8083; legacy
# subscription, download, compatibility, and unknown paths remain on 8081.
server {
    listen __HY_HTTPS_PORT__ ssl;
    listen [::]:__HY_HTTPS_PORT__ ssl;
    server_name __HY_SERVER_HOST__;
    if ($host != "__HY_SERVER_HOST__") { return 421; }
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn hy2_panel_conn 20;
    limit_conn_status 429;
    limit_req zone=hy2_panel_req burst=40 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/hysteria-panel.access.log hy2_no_args;
    error_log /var/log/nginx/hysteria-panel.error.log crit;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml text/yaml;

    ssl_certificate __HY_TLS_CERT__;
    ssl_certificate_key __HY_TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HY2TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    # React documents are exact routes; there is deliberately no SPA fallback.
    location = / {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /login {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/login {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /logout {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/logout {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/change-password {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /user/panel {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/logs {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/settings {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/usage {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/daily {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/usage-history {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/health {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/incidents {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/config {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/rules {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /admin/landing-egresses {
        proxy_pass http://127.0.0.1:8083;
    }
    location ~ ^/admin/user/[^/]+\.json$ {
        proxy_pass http://127.0.0.1:8081;
    }
    location ~ ^/admin/user/[^/]+$ {
        proxy_pass http://127.0.0.1:8083;
    }

    # React's authenticated API and immutable build assets.
    location = /api/v1 {
        proxy_pass http://127.0.0.1:8083;
    }
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8083;
    }
    location ^~ /static/react/assets/ {
        proxy_pass http://127.0.0.1:8083;
    }

    # Legacy downloads, subscription exchanges, compatibility pages and all
    # other paths stay on the existing service until their own cutover.
    location ^~ /sub/ {
        proxy_pass http://127.0.0.1:8081;
    }
    location ^~ /panel/ {
        proxy_pass http://127.0.0.1:8081;
    }
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8081;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_set_header Host __HY_SERVER_HOST__;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port $server_port;
}
