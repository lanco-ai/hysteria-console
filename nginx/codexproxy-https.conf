# HTTPS management and API entry for local CLIProxyAPI (CodexProxy / CPA).
server {
    listen 9445 ssl;
    listen [::]:9445 ssl;
    server_name lancoai.site;
    if ($host != "lancoai.site") { return 421; }

    ssl_certificate /etc/letsencrypt/live/lancoai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lancoai.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HY2CPATLS:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        return 302 /management.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8317;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
